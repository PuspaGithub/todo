<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO</title>
</head>
<body>
    <div class="app">
        <!-- SIDEBAR-- All Project -->
        <aside class="sidebar">
            <h1 class="logo">TODO</h1>

            <nav>
                <h2 class="sidebar-heading">Projects</h2>
                <ul class="project-list" id="project-list">

                </ul>
            </nav>
            <button class="btn btn-ghost" id="new-project-btn">
                + New Project
            </button>
        </aside>

        <main class="main-page" id="todo-display">
            <h1 class="project-name" id="project-name">Project Name</h1>
            <button class="add-todo" id="add-todo">+ Add Todo</button>
            <table>
                <thead>
                    <tr>
                        <th>S.N</th>
                        <th>Todo</th>
                        <th>Description</th>
                        <th>Due Date</th>
                        <th>Priority</th>
                        <th>Update</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="tbody">

                </tbody>
            </table>
        </main>
    </div>

    <!-- ========= Add Project Dialog ============= -->
    <dialog id="project-dialog">
        <form method="dialog" class="dialog-form" id="project-form" novalidate>
            <h3>New Project</h3>
            <label>
                Name
                <input type="text" name="name" id="project-input" required>
            </label>
            <div class="actions">
                <button class="btn btn-ghost" id="cancel-project">Cancel</button>
                <button type="submit" class="btn btn-primary">Create</button>
            </div>
        </form>
    </dialog>

    <!-- ======================= DIALOG: NEW TODO ========================= -->
    <dialog id="todo-dialog">
        <form method="dialog" class="dialog-form" id="todo-form">
            <h3>New Todo</h3>
            <label>
                Title
                <input type="text" name="title" required>
            </label>
            <label>
                Description
                <textarea name="description" rows="3"></textarea>
            </label>
            <div class="row">
                <label>
                    Due Date
                    <input type="date" name="dueDate" required>
                </label>
                <label>
                    Priority
                    <select name="priority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </label>
            </div>
            <label>
                Project
                <select name="project" id="todo-project-select">

                </select>
            </label>
            <div class="actions">
                <button type="button" value="cancel" class="btn btn-ghost" id="cancel-todo">Cancel</button>
                <button class="btn btn-primary" id="submit-todo" type="submit">Add Todo</button>
            </div>
        </form>
    </dialog>
</body>
</html>
